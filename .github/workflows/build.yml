name: Build and Release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build thumbnail.wasm
        run: ./build.sh
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: vips-thumbnail.wasm
          generate_release_notes: true
