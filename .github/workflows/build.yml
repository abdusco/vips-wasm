name: Build and Release

on:
  push:
    tags: ['v*']

jobs:
  build-release-and-pr:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build thumbnail.wasm
        env:
          DOCKER_BUILD_FLAGS: --load --cache-from type=gha --cache-to type=gha,mode=max
        run: ./build.sh
      - name: Detect embedded wasm changes
        id: changes
        run: |
          if git diff --quiet -- govips/thumbnail.wasm; then
            echo "wasm_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "wasm_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate changelog
        id: changelog
        run: |
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git tag --sort=-creatordate | awk -v cur="$current_tag" 'found { print; exit } $0 == cur { found=1 }')

          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..${current_tag}"
          else
            range="$current_tag"
          fi

          {
            echo "changelog<<EOF"
            .github/generate_changelog.sh "$range"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: vips-thumbnail.wasm
      - name: Create PR for embedded wasm update
        if: steps.changes.outputs.wasm_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/sync-embedded-wasm-${{ github.ref_name }}
          base: master
          title: "chore(wasm): sync embedded wasm for ${{ github.ref_name }}"
          commit-message: "chore(wasm): sync embedded wasm for ${{ github.ref_name }}"
          body: |
            Updates `govips/thumbnail.wasm` from the tagged build `${{ github.ref_name }}`.

            This PR is created automatically by CI when the embedded wasm changes.
          add-paths: |
            govips/thumbnail.wasm
